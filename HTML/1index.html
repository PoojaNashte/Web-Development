<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Development</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f8bbd0, #e1bee7);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    h1 {
      font-size: 3em;
      font-weight: 800;
      margin-bottom: 10px;
      color: #4a148c;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
    }

    .info {
      font-size: 1.2em;
      font-weight: 500;
      margin-bottom: 35px;
      color: #6a1b9a;
      background-color: rgba(255, 255, 255, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .assignment {
      width: 320px;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 15px 25px;
      margin: 15px 0;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.3s, background-color 0.3s;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      color: #4a148c;
      cursor: pointer;
    }

    .assignment:hover {
      background-color: rgba(255, 255, 255, 1);
      transform: scale(1.05);
    }

    .icon {
      font-size: 1.6em;
    }

    .html-icon { color: #e65100; }
    .css-icon { color: #1e88e5; }
    .xml-icon { color: #f9a825; }

    @media (max-width: 400px) {
      .assignment {
        width: 90%;
        font-size: 1.1em;
      }

      h1 {
        font-size: 2.2em;
      }

      .info {
        font-size: 1em;
        padding: 8px;
        text-align: center;
      }
    }
  </style>

  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Web Development</h1>

  <div class="info">
    Name: Pooja Manoj Nashte &nbsp;|&nbsp; Roll No: 35 &nbsp;|&nbsp; Div: B
  </div>

  <div class="assignment">
    <i class="fab fa-html5 icon html-icon"></i> HTML Assignment
  </div>

  <div class="assignment">
    <i class="fab fa-css3-alt icon css-icon"></i> CSS Assignment
  </div>

  <div class="assignment">
    <i class="fas fa-code icon xml-icon"></i> XML Assignment
  </div>

</body>
</html>
