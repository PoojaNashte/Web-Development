<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url('universe.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 3em;
      text-shadow: 2px 2px 5px black;
    }

    .space-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .planet {
      position: absolute;
      width: 120px;
      transition: transform 0.4s ease;
    }

    .planet:hover {
      transform: scale(1.1);
    }

    #sun {
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
    }

    #earth {
      bottom: 20%;
      left: 20%;
    }

    #moon {
      bottom: 15%;
      right: 20%;
    }

    .labels {
      margin-top: 60vh;
      font-size: 1.2em;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h1>Assignment 2 - Space Theme</h1>

  <div class="space-container">
       <img id="sun" class="planet" src="sun.jpg" alt="Sun">

       <img id="earth" class="planet" src="earth.jpg" alt="Earth">

        <img id="moon" class="planet" src="moon.jpg" alt="Moon">

    <div class="labels">
      This assignment showcases the Sun, Earth, and Moon with a universe background.
    </div>
  </div>

</body>
</html>
