<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 6 - Embedded Content</title>
  <style>
    body {
      background-color: #e0f7fa;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #006064;
      text-shadow: 1px 1px 3px #aaa;
    }

    iframe {
      border: 2px solid #006064;
      margin: 20px 0;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    .section {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

  <h1>Assignment 6 - Embedded Content using Iframes</h1>

  <div class="section">
    <h2>YouTube Video</h2>
    <iframe width="560" height="315" 
      src="https://www.youtube.com/embed/tgbNymZ7vqY" 
      title="YouTube video"
      allowfullscreen>
    </iframe>
  </div>

  <div class="section">
    <h2>Google Map</h2>
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d241317.11609735158!2d72.74109920470754!3d19.08219783916056!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7b63b5b38ef01%3A0xd8126a9be0419bf!2sMumbai%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1649997979796!5m2!1sen!2sin" 
      width="600" 
      height="400" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy">
    </iframe>
  </div>

  <div class="section">
    <h2>Embedded PDF Document</h2>
    <iframe 
      src="Syllabus.pdf" 
      width="600" 
      height="500">
    </iframe>
    <p style="font-size: 14px;"</p>
  </div>

  <div class="section">
    <h2>Embedded Web Page (Wikipedia)</h2>
    <iframe 
      src="https://en.wikipedia.org/wiki/Bird" 
      width="600" 
      height="400">
    </iframe>
  </div>

</body>
</html>
